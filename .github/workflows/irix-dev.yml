name: irix-dev

# Development-only twin of irix.yml.
#
# It targets a label carried by exactly one throwaway runner, so iterating on
# the runner cannot collide with whatever is registered in the org IRIX group.
# irix.yml keeps the realistic `runs-on: [self-hosted, irix]`.
#
# Delete this once the handlers are stable.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, octane-t1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build something small
        run: |
          uname -a
          mkdir -p out
          cat > hello.c <<'EOF'
          #include <stdio.h>
          int main(void){ printf("built on IRIX\n"); return 0; }
          EOF
          gcc -O2 -o out/hello hello.c
          ./out/hello
          file out/hello

      - name: Confinement actually bites
        run: |
          echo "nofile: $(ulimit -n)"
          echo "fsize:  $(ulimit -f)"
          echo "core:   $(ulimit -c)"
          echo "cpu:    $(ulimit -t)"
          echo "--- a 5GB write must fail against the 4GB file cap ---"
          if dd if=/dev/zero of=big.bin bs=1048576 count=5000 2>/dev/null; then
            echo "UNEXPECTED: the write was not capped"; rm -f big.bin; exit 1
          else
            echo "capped as expected"; rm -f big.bin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hello-irix
          path: out

  verify:
    needs: build
    runs-on: [self-hosted, octane-t1]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello-irix

      - name: Run what the other job built
        run: |
          ls -la out
          chmod +x out/hello
          ./out/hello
