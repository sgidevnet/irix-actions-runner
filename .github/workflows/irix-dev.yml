name: irix-dev

# Development-only twin of irix.yml.
#
# It targets a label carried by exactly one throwaway runner, so iterating on
# the runner cannot collide with whatever is registered in the org IRIX group.
# irix.yml keeps the realistic `runs-on: [self-hosted, irix]`.
#
# Delete this once the handlers are stable.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, octane-t1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build something small
        run: |
          uname -a
          mkdir -p out
          cat > hello.c <<'EOF'
          #include <stdio.h>
          int main(void){ printf("built on IRIX\n"); return 0; }
          EOF
          gcc -O2 -o out/hello hello.c
          ./out/hello
          file out/hello

      - uses: actions/upload-artifact@v4
        with:
          name: hello-irix
          path: out

  verify:
    needs: build
    runs-on: [self-hosted, octane-t1]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello-irix

      - name: Run what the other job built
        run: |
          ls -la out
          chmod +x out/hello
          ./out/hello
