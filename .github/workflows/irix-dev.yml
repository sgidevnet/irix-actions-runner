name: irix-dev

# Development-only twin of irix.yml.
#
# It targets a label carried by exactly one throwaway runner, so iterating on
# the runner cannot collide with whatever is registered in the org IRIX group.
# irix.yml keeps the realistic `runs-on: [self-hosted, irix]`.
#
# Delete this once the handlers are stable.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, octane-t1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # cc is MIPSPro, which the emulated guest carries. The Octane builds with
      # SGUG gcc; irix.yml is the realistic twin.
      - name: Build something small
        run: |
          uname -a
          mkdir -p out
          cat > hello.c <<'EOF'
          #include <stdio.h>
          int main(void){ printf("built on IRIX\n"); return 0; }
          EOF
          cc -O2 -o out/hello hello.c
          ./out/hello
          file out/hello

      - name: Confinement actually bites
        run: |
          echo "nofile: $(ulimit -n)"
          echo "fsize:  $(ulimit -f)"
          echo "core:   $(ulimit -c)"
          echo "cpu:    $(ulimit -t)"
          # seek past the cap instead of filling to it: RLIMIT_FSIZE is on the
          # resulting size, so one block at 5 GB fails the same way. Writing the
          # whole 4 GB through emulated SCSI cost 81 s of a 105 s job.
          echo "--- a write past the 4GB file cap must fail ---"
          if dd if=/dev/zero of=big.bin bs=1048576 count=1 seek=5000 2>/dev/null; then
            echo "UNEXPECTED: the write was not capped"; rm -f big.bin; exit 1
          else
            echo "capped as expected"; rm -f big.bin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hello-irix
          path: out

  verify:
    needs: build
    runs-on: [self-hosted, octane-t1]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hello-irix

      - name: Run what the other job built
        run: |
          ls -la out
          chmod +x out/hello
          ./out/hello

  expressions:
    runs-on: [self-hosted, octane-t1]
    timeout-minutes: 5
    env:
      JOB_SCOPE: job
    steps:
      - name: Interpolation in a run body, ${{ github.run_number }}
        env:
          STEP_SCOPE: step
        run: |
          echo "repo    ${{ github.repository }}"
          echo "run     ${{ github.run_id }}/${{ github.run_attempt }}"
          echo "upper   ${{ format('{0}', github.event_name) }}"
          echo "env     ${{ env.JOB_SCOPE }}/${{ env.STEP_SCOPE }}"
          test "${{ github.repository_owner }}" = sgidevnet

      - name: Skipped by a real comparison
        if: github.event_name == 'never-happens'
        run: exit 1

      - name: Run when the comparison holds
        if: startsWith(github.ref, 'refs/') && !cancelled()
        run: echo "conditions work"

      - name: Make a file to upload
        run: |
          mkdir -p expr-out
          date > expr-out/stamp

      - uses: actions/upload-artifact@v4
        with:
          name: expr-${{ github.run_id }}
          path: expr-out
