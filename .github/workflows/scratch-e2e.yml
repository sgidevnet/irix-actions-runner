# Temporary. Runs every job in release.yml except publish, which needs a
# tag. The version comes from src/version.h and the job bodies are lifted
# unchanged. Delete before merging.
name: scratch e2e
"on":
  push:
    branches:
    - release/cross-and-test-on-target
permissions:
  contents: read
  packages: read
jobs:
  build-irix:
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.IRIX_CROSS_IMAGE || 'ghcr.io/sgidevnet/irix-cross:0.1.0' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Version agrees with the checked-out tree
      run: "set -euo pipefail\nver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\\
        (.*\\)\".*/\\1/p' src/version.h)\nhdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\
        \\(.*\\)\".*/\\1/p' src/version.h)\nif [ \"$hdr\" != \"$ver\" ]; then\n  echo \"tag says $ver,\
        \ src/version.h says $hdr\"; exit 1\nfi\n\n# The manpage is hand-written, so its .TH version is\
        \ the one thing in\n# it that can go stale without anyone noticing.\nman=$(sed -n 's/^\\.TH RUNNER\
        \ 1 .*\"irix-actions-runner \\([^\"]*\\)\".*/\\1/p' man/runner.1)\nif [ \"$man\" != \"$ver\" ];\
        \ then\n  echo \"tag says $ver, man/runner.1 says $man\"; exit 1\nfi\necho \"building $ver from\
        \ $GITHUB_SHA\"\n"
    - name: Portability gate
      run: 'set -euo pipefail

        make check

        '
    - name: Build the runner and the test binaries
      run: 'set -euo pipefail

        # IRIX_SYSROOT is what puts the Makefile on its cross branch. The

        # image sets it, along with IRIX_OPENSSL and MOGRIX_NO_DLMALLOC.

        test -n "${IRIX_SYSROOT:-}" || { echo "not an IRIX cross image"; exit 1; }

        make -j"$(nproc)"

        make -j"$(nproc)" tests

        ls -l build/runner build/test_json

        '
    - name: The binary is portable to any IRIX 6.5 machine
      run: "set -euo pipefail\ndesc=$(file build/runner)\necho \"$desc\"\n# MIPS III is R4000 and later,\
        \ which is every CPU that runs IRIX 6.5.\n# MIPS IV would quietly exclude the R4400 and R5000\
        \ machines.\ncase \"$desc\" in\n  *MIPS-IV*) echo \"ISA is MIPS IV; that excludes R4000 and R5000\"\
        ; exit 1 ;;\n  *N32*MIPS-III*) ;;\n  *) echo \"expected an N32 MIPS-III object\"; exit 1 ;;\n\
        esac\ncase \"$desc\" in *MSB*) ;; *) echo \"not big-endian\"; exit 1 ;; esac\n\nreadelf -d build/runner\
        \ | grep -E 'NEEDED|RPATH' || true\nneeded=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\\\
        [\\(.*\\)\\].*/\\1/p' | sort | tr '\\n' ' ')\nif [ \"$needed\" != \"libc.so.1 libm.so libpthread.so\
        \ \" ]; then\n  echo \"unexpected library dependencies: $needed\"; exit 1\nfi\nfor bad in libssl\
        \ libcrypto libz sgug; do\n  if readelf -d build/runner | grep -q \"$bad\"; then\n    echo \"\
        not self-contained: links $bad\"; exit 1\n  fi\ndone\n"
    - name: Record what built it
      run: "set -euo pipefail\n{\n  echo \"built on   $(uname -a) (cross)\"\n  echo \"compiler   $(clang\
        \ --version | sed -n 1p)\"\n  echo \"linker     $(basename \"$IRIX_LLD\")\"\n  echo \"openssl\
        \    $(strings -a build/runner | grep '^OpenSSL 1\\.' | sed -n 1p)\"\n} > build/BUILD-FACTS\n\
        cat build/BUILD-FACTS\nfind build \\( -name '*.o' -o -name '*.d' \\) -delete\n"
    - uses: actions/upload-artifact@v4
      with:
        name: irix-binary
        path: build
  test-irix:
    needs: build-irix
    runs-on:
    - self-hosted
    - irix
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Clean the workspace
      run: 'set -eu

        git clean -xdff

        '
    - uses: actions/download-artifact@v4
      with:
        name: irix-binary
    - name: Run the unit tests on IRIX
      run: 'set -eu

        chmod 0755 build/runner build/test_*

        make test-run

        '
    - name: The binary starts on a stock machine
      run: "set -eu\n# env -i proves rld resolves every symbol against base IRIX, with no\n# LD_LIBRARYN32_PATH\
        \ and nothing inherited from the runner.\necho \"--- clean environment ---\"\nenv -i ./build/runner\
        \ version\nver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\(.*\\)\".*/\\\
        1/p' src/version.h)\nif [ \"$(env -i ./build/runner version | sed -n 1p)\" != \"irix-actions-runner\
        \ $ver\" ]; then\n  echo \"the built binary does not report $ver\"; exit 1\nfi\n"
    - name: TLS works against the bundle we ship
      run: "set -eu\nca=\"$PWD/contrib/cacert.pem\"\nn=$(grep -c 'BEGIN CERTIFICATE' \"$ca\")\necho \"\
        bundle carries $n certificates\"\nif [ \"$n\" -lt 100 ]; then echo \"bundle looks truncated\"\
        ; exit 1; fi\n\n# Negative control. Without it a future change that ignores\n# SSL_CERT_FILE would\
        \ leave this gate passing forever while proving\n# only that SGUG-RSE happens to be installed\
        \ on the machine.\nif SSL_CERT_FILE=/nonexistent/ca.pem ./build/runner selftest >/dev/null 2>&1;\
        \ then\n  echo \"selftest passed with a nonexistent bundle; this gate proves nothing\"\n  exit\
        \ 1\nfi\necho \"negative control ok\"\n\ni=1\nwhile [ \"$i\" -le 3 ]; do\n  if SSL_CERT_FILE=\"\
        $ca\" ./build/runner selftest; then break; fi\n  if [ \"$i\" -eq 3 ]; then echo \"selftest failed\
        \ three times\"; exit 1; fi\n  sleep 20\n  i=$((i + 1))\ndone\n"
    - name: Strip, and prove it still runs
      run: 'set -eu

        strip build/runner

        ls -l build/runner

        env -i ./build/runner version

        rm -f build/test_*

        '
    - uses: actions/upload-artifact@v4
      with:
        name: irix-stripped
        path: build
  package-irix:
    needs: test-irix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: irix-stripped
        path: bin
    - name: The binary is portable to any IRIX 6.5 machine
      run: "set -euo pipefail\n# download-artifact does not restore Unix modes. 0755 is the intent,\n\
        # not something to preserve.\nchmod 0755 bin/build/runner\ndesc=$(file bin/build/runner)\necho\
        \ \"$desc\"\ncase \"$desc\" in\n  *MIPS-IV*) echo \"ISA is MIPS IV; that excludes R4000 and R5000\"\
        ; exit 1 ;;\n  *N32*MIPS-III*) ;;\n  *) echo \"expected an N32 MIPS-III object\"; exit 1 ;;\n\
        esac\ncase \"$desc\" in *MSB*) ;; *) echo \"not big-endian\"; exit 1 ;; esac\n\nneeded=$(readelf\
        \ -d bin/build/runner | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\].*/\\1/p' | sort | tr '\\n' ' ')\necho\
        \ \"needs $needed\"\nif [ \"$needed\" != \"libc.so.1 libm.so libpthread.so \" ]; then\n  echo\
        \ \"unexpected library dependencies: $needed\"; exit 1\nfi\nfor bad in libssl libcrypto libz sgug;\
        \ do\n  if readelf -d bin/build/runner | grep -q \"$bad\"; then\n    echo \"not self-contained:\
        \ links $bad\"; exit 1\n  fi\ndone\n"
    - name: Package
      run: "set -euo pipefail\nver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\\
        (.*\\)\".*/\\1/p' src/version.h)\nname=\"irix-actions-runner-$ver-irix6.5-mips-n32\"\nrm -rf dist\
        \ \"$name\"\nmkdir -p \"$name\" dist\n\ncp bin/build/runner \"$name/runner\"\ncp contrib/cacert.pem\
        \ \"$name/cert.pem\"\ncp README.md LICENSE CHANGELOG.md \"$name/\"\ncp man/runner.1 \"$name/runner.1\"\
        \nchmod 0755 \"$name/runner\"\nchmod 0644 \"$name/cert.pem\" \"$name/README.md\" \"$name/LICENSE\"\
        \ \\\n    \"$name/CHANGELOG.md\" \"$name/runner.1\"\n\n{\n  echo \"project    $ver\"\n  echo \"\
        commit     $GITHUB_SHA\"\n  echo \"tag        $GITHUB_REF_NAME\"\n  echo \"run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"\
        \n  cat bin/build/BUILD-FACTS\n  echo \"packaged   $(uname -srm)\"\n  echo \"object     $(file\
        \ \"$name/runner\")\"\n  echo \"needs      $(readelf -d \"$name/runner\" | sed -n 's/.*NEEDED.*\\\
        [\\(.*\\)\\].*/\\1/p' | tr '\\n' ' ')\"\n  echo \"ca bundle  $(sed -n 's/^## Certificate data\
        \ from Mozilla as of: //p' contrib/cacert.pem)\"\n} > \"$name/BUILD-INFO\"\nchmod 0644 \"$name/BUILD-INFO\"\
        \ncat \"$name/BUILD-INFO\"\n\n# ustar because stock IRIX tar understands nothing newer, and it\
        \ has\n# no -z either, hence the separate gzip. Sorted with a fixed mtime so\n# the same tag produces\
        \ the same bytes.\ntar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name \\\n   \
        \ --mtime=\"@$(git log -1 --format=%ct)\" -cf \"dist/$name.tar\" \"$name\"\ngzip -9n \"dist/$name.tar\"\
        \n(cd dist && sha256sum \"$name.tar.gz\" > \"$name.tar.gz.sha256\")\ncat \"dist/$name.tar.gz.sha256\"\
        \nls -l dist\n"
    - uses: actions/upload-artifact@v4
      with:
        name: irix-dist
        path: dist
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          triple: ''
          elf: x86-64
          pkg: ''
        - arch: arm64
          triple: aarch64-linux-gnu
          elf: aarch64
          pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Toolchain
      run: "set -euo pipefail\nsudo apt-get update -qq\nif [ -n \"${{ matrix.triple }}\" ]; then\n  #\
        \ OpenSSL for the target arch comes from ports; archive and\n  # security carry amd64 only, and\
        \ apt fails the whole update on a\n  # 404 for one index. So pin the stock sources to amd64 before\n\
        \  # adding the architecture. 24.04 uses deb822, older images the\n  # one-line format, hence\
        \ both.\n  if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then\n    sudo sed -i '/^Types:/a\
        \ Architectures: amd64' \\\n      /etc/apt/sources.list.d/ubuntu.sources\n  fi\n  sudo sed -i\
        \ 's/^deb \\([^[]\\)/deb [arch=amd64] \\1/' \\\n    /etc/apt/sources.list 2>/dev/null || true\n\
        \  sudo dpkg --add-architecture arm64\n  sudo tee /etc/apt/sources.list.d/ports.list >/dev/null\
        \ <<'PORTS'\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe\ndeb [arch=arm64]\
        \ http://ports.ubuntu.com/ubuntu-ports noble-updates main universe\nPORTS\n  sudo apt-get update\
        \ -qq\n  sudo apt-get install -y --no-install-recommends ${{ matrix.pkg }} libssl-dev:arm64\n\
        else\n  sudo apt-get install -y --no-install-recommends libssl-dev\nfi\nuname -srm\ncc --version\
        \ | sed -n 1p\nldd --version | sed -n 1p\n"
    - name: Version agrees with the checked-out tree
      run: "set -euo pipefail\nver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\\
        (.*\\)\".*/\\1/p' src/version.h)\nhdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\
        \\(.*\\)\".*/\\1/p' src/version.h)\nif [ \"$hdr\" != \"$ver\" ]; then\n  echo \"tag says $ver,\
        \ src/version.h says $hdr\"; exit 1\nfi\nman=$(sed -n 's/^\\.TH RUNNER 1 .*\"irix-actions-runner\
        \ \\([^\"]*\\)\".*/\\1/p' man/runner.1)\nif [ \"$man\" != \"$ver\" ]; then\n  echo \"tag says\
        \ $ver, man/runner.1 says $man\"; exit 1\nfi\n"
    - name: Portability gate
      run: 'set -euo pipefail

        make clean

        make check

        '
    - name: Build the runner and the test binaries
      run: "set -euo pipefail\nif [ -n \"${{ matrix.triple }}\" ]; then\n  export CC=${{ matrix.triple\
        \ }}-gcc\nfi\n# Test binaries are built here and executed in test-linux, so both\n# targets are\
        \ produced by the same toolchain on the same machine.\nmake -j\"$(nproc)\" CC=\"${CC:-cc}\"\n\
        make -j\"$(nproc)\" CC=\"${CC:-cc}\" tests\nls -l build/runner build/test_json\n"
    - name: The binary is what this matrix entry claims
      run: "set -euo pipefail\ndesc=$(file build/runner)\necho \"$desc\"\ncase \"$desc\" in *\"ELF 64-bit\
        \ LSB\"*) ;; *) echo \"not a 64-bit LSB ELF\"; exit 1 ;; esac\ncase \"$desc\" in\n  *${{ matrix.elf\
        \ }}*) ;;\n  *) echo \"expected ${{ matrix.elf }}\"; exit 1 ;;\nesac\n\n# An allowlist, not the\
        \ exact string the IRIX job asserts: two arches\n# have two loaders, and glibc 2.34 folded libpthread\
        \ into libc. The\n# loader is a NEEDED entry on aarch64 and not on x86_64.\nallow=\"libc.so.6\
        \ libm.so.6 libssl.so.3 libcrypto.so.3\"\nallow=\"$allow ld-linux-x86-64.so.2 ld-linux-aarch64.so.1\"\
        \nneeded=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\].*/\\1/p' | tr '\\n' '\
        \ ')\necho \"$needed\"\nfor n in $needed; do\n  case \" $allow \" in\n    *\" $n \"*) ;;\n   \
        \ *) echo \"unexpected dependency: $n\"; exit 1 ;;\n  esac\ndone\nfor want in libssl.so.3 libcrypto.so.3;\
        \ do\n  case \" $needed \" in\n    *\" $want \"*) ;;\n    *) echo \"expected a dynamic $want\"\
        ; exit 1 ;;\n  esac\ndone\n"
    - name: Strip, prove it still runs, and record what built it
      run: "set -euo pipefail\nif [ -n \"${{ matrix.triple }}\" ]; then\n  export CC=${{ matrix.triple\
        \ }}-gcc\n  ${{ matrix.triple }}-strip build/runner\nelse\n  strip build/runner\nfi\nls -l build/runner\n\
        {\n  echo \"built on   $(uname -a)\"\n  echo \"compiler   $(${CC:-cc} --version | sed -n 1p)\"\
        \n  echo \"glibc      $(ldd --version | sed -n 1p)\"\n  echo \"openssl    $(openssl version)\"\
        \n} > build/BUILD-FACTS\ncat build/BUILD-FACTS\n"
    - uses: actions/upload-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: build/
  test-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: build
    - name: Run the unit tests on real ${{ matrix.arch }}
      run: "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends\
        \ libssl3 || true\nchmod 0755 build/* 2>/dev/null || true\nuname -srm\nfile build/runner\n# test-run\
        \ executes the binaries as built; it never compiles.\nmake test-run\n\n# A clean environment,\
        \ so this proves the binary resolves every\n# symbol against a stock image and inherits nothing\
        \ from the runner.\n# The assertion moved here from build-linux, which cross-compiles and\n# so\
        \ cannot run what it produced.\necho \"--- clean environment ---\"\nenv -i ./build/runner version\n\
        ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\(.*\\)\".*/\\1/p' src/version.h)\n\
        if [ \"$(env -i ./build/runner version | sed -n 1p)\" != \"irix-actions-runner $ver\" ]; then\n\
        \  echo \"the built binary does not report $ver\"; exit 1\nfi\n"
    - name: TLS works against the system trust store
      run: "set -euo pipefail\nif SSL_CERT_FILE=/nonexistent/ca.pem ./build/runner selftest >/dev/null\
        \ 2>&1; then\n  echo \"selftest passed with a nonexistent bundle; this gate proves nothing\"\n\
        \  exit 1\nfi\necho \"negative control ok\"\n\ni=1\nwhile [ \"$i\" -le 3 ]; do\n  if ./build/runner\
        \ selftest; then break; fi\n  if [ \"$i\" -eq 3 ]; then echo \"selftest failed three times\";\
        \ exit 1; fi\n  sleep 20\n  i=$((i + 1))\ndone\n"
  package-linux:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        arch:
        - x86_64
        - arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: bin
    - name: Package
      run: "set -euo pipefail\nver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\\
        (.*\\)\".*/\\1/p' src/version.h)\nname=\"irix-actions-runner-$ver-linux-${{ matrix.arch }}\"\n\
        rm -rf dist \"$name\"\nmkdir -p \"$name\" dist\n\n# download-artifact does not restore Unix modes.\
        \ 0755 is the intent,\n# not something to preserve.\ncp bin/runner \"$name/runner\"\ncp README.md\
        \ LICENSE CHANGELOG.md \"$name/\"\ncp man/runner.1 \"$name/runner.1\"\nchmod 0755 \"$name/runner\"\
        \nchmod 0644 \"$name/README.md\" \"$name/LICENSE\" \"$name/CHANGELOG.md\" \\\n    \"$name/runner.1\"\
        \n\n{\n  echo \"project    $ver\"\n  echo \"commit     $GITHUB_SHA\"\n  echo \"tag        $GITHUB_REF_NAME\"\
        \n  echo \"run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"\n  cat\
        \ bin/BUILD-FACTS\n  echo \"packaged   $(uname -srm)\"\n  echo \"object     $(file \"$name/runner\"\
        )\"\n  echo \"needs      $(readelf -d \"$name/runner\" | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\].*/\\\
        1/p' | tr '\\n' ' ')\"\n} > \"$name/BUILD-INFO\"\nchmod 0644 \"$name/BUILD-INFO\"\ncat \"$name/BUILD-INFO\"\
        \n\n# ustar and a fixed mtime for the same reason as the IRIX tarball:\n# the same tag produces\
        \ the same bytes.\ntar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name \\\n   \
        \ --mtime=\"@$(git log -1 --format=%ct)\" -cf \"dist/$name.tar\" \"$name\"\ngzip -9n \"dist/$name.tar\"\
        \n(cd dist && sha256sum \"$name.tar.gz\" > \"$name.tar.gz.sha256\")\ncat \"dist/$name.tar.gz.sha256\"\
        \nls -l dist\n"
    - uses: actions/upload-artifact@v4
      with:
        name: linux-dist-${{ matrix.arch }}
        path: dist
  verify:
    needs:
    - package-irix
    - package-linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-dist*'
        path: dl
    - name: Verify what came off the build machines
      run: "set -euo pipefail\nn=0\nfor t in dl/*/*.tar.gz; do\n  echo \"--- $t\"\n  (cd \"$(dirname \"\
        $t\")\" && sha256sum -c \"$(basename \"$t\").sha256\")\n  # Listed to a file and grepped there,\
        \ not piped. `grep -q` exits on\n  # its first match, and under `pipefail` the SIGPIPE that gives\
        \ the\n  # producer fails the step. That is a race on how much tar has\n  # written, so it looks\
        \ like a flake rather than a bug.\n  tar -tvzf \"$t\" > listing\n  cat listing\n  if ! grep -Eq\
        \ '^-rwxr-xr-x .*/runner$' listing; then\n    echo \"the executable bit did not survive packaging\"\
        ; exit 1\n  fi\n  n=$((n + 1))\ndone\n# Counted, because the loop is silent about an artifact\
        \ that never\n# arrived. An earlier revision took only the first match and would\n# have published\
        \ one tarball out of three without saying so.\nif [ \"$n\" -ne 3 ]; then\n  echo \"expected 3\
        \ tarballs, found $n\"; exit 1\nfi\n"
