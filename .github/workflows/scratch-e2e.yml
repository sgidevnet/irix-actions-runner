# Temporary. Runs every job in release.yml except publish, which needs a tag.
# The version comes from src/version.h; the job bodies are lifted unchanged.
# Generated by contrib/cross/mkscratch.py. Delete before merging.
name: scratch e2e
'on':
  push:
    branches:
    - release/cross-and-test-on-target
permissions:
  contents: read
  packages: read
jobs:
  build-irix:
    runs-on: ubuntu-24.04
    container: ${{ vars.IRIX_CROSS_IMAGE || 'ghcr.io/sgidevnet/irix-cross:0.2.0' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Version
      run: |
        set -euo pipefail
        ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        hdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        if [ "$hdr" != "$ver" ]; then
          echo "tag says $ver, src/version.h says $hdr"; exit 1
        fi

        # The manpage is hand-written, so its .TH version is the one thing in
        # it that can go stale without anyone noticing.
        man=$(sed -n 's/^\.TH RUNNER 1 .*"irix-actions-runner \([^"]*\)".*/\1/p' man/runner.1)
        if [ "$man" != "$ver" ]; then
          echo "tag says $ver, man/runner.1 says $man"; exit 1
        fi
        echo "building $ver from $GITHUB_SHA"
    - name: Portability gate
      run: |
        set -euo pipefail
        make check
    - name: Build
      run: |
        set -euo pipefail
        # IRIX_SYSROOT is what puts the Makefile on its cross branch. The
        # image sets it, along with IRIX_OPENSSL and MOGRIX_NO_DLMALLOC.
        test -n "${IRIX_SYSROOT:-}" || { echo "not an IRIX cross image"; exit 1; }
        make -j"$(nproc)"
        make -j"$(nproc)" tests
        ls -l build/runner build/test_json
    - name: ELF assertions
      run: |
        set -euo pipefail
        desc=$(file build/runner)
        echo "$desc"
        # MIPS III is R4000 and later, which is every CPU that runs IRIX 6.5.
        # MIPS IV would quietly exclude the R4400 and R5000 machines.
        case "$desc" in
          *MIPS-IV*) echo "ISA is MIPS IV; that excludes R4000 and R5000"; exit 1 ;;
          *N32*MIPS-III*) ;;
          *) echo "expected an N32 MIPS-III object"; exit 1 ;;
        esac
        case "$desc" in *MSB*) ;; *) echo "not big-endian"; exit 1 ;; esac

        readelf -d build/runner | grep -E 'NEEDED|RPATH' || true
        needed=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | sort | tr '\n' ' ')
        if [ "$needed" != "libc.so.1 libm.so libpthread.so " ]; then
          echo "unexpected library dependencies: $needed"; exit 1
        fi
        for bad in libssl libcrypto libz sgug; do
          if readelf -d build/runner | grep -q "$bad"; then
            echo "not self-contained: links $bad"; exit 1
          fi
        done
    - name: Strip and stamp
      run: |
        set -euo pipefail
        llvm-strip build/runner
        ls -l build/runner
        {
          echo "built on   $(uname -a) (cross)"
          echo "compiler   $(clang --version | sed -n 1p)"
          echo "linker     $(basename "$IRIX_LLD")"
          echo "openssl    $(strings -a build/runner | grep '^OpenSSL 1\.' | sed -n 1p)"
        } > build/BUILD-FACTS
        cat build/BUILD-FACTS
        find build \( -name '*.o' -o -name '*.d' \) -delete
    - uses: actions/upload-artifact@v4
      with:
        name: irix-binary
        path: build
  test-irix:
    needs: build-irix
    runs-on:
    - self-hosted
    - irix
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Clean
      run: |
        set -eu
        git clean -xdff
    - uses: actions/download-artifact@v4
      with:
        name: irix-binary
        path: build
    - name: Unit tests
      run: |
        set -eu
        chmod 0755 build/runner build/test_*
        make test-run
    - name: Clean-environment start
      run: |
        set -eu
        # env -i proves rld resolves every symbol against base IRIX, with no
        # LD_LIBRARYN32_PATH and nothing inherited from the runner.
        echo "--- clean environment ---"
        env -i ./build/runner version
        ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        if [ "$(env -i ./build/runner version | sed -n 1p)" != "irix-actions-runner $ver" ]; then
          echo "the built binary does not report $ver"; exit 1
        fi
    - name: TLS selftest
      run: |
        set -eu
        ca="$PWD/contrib/cacert.pem"
        n=$(grep -c 'BEGIN CERTIFICATE' "$ca")
        echo "bundle carries $n certificates"
        if [ "$n" -lt 100 ]; then echo "bundle looks truncated"; exit 1; fi

        # Negative control. Without it a future change that ignores
        # SSL_CERT_FILE would leave this gate passing forever while proving
        # only that SGUG-RSE happens to be installed on the machine.
        if SSL_CERT_FILE=/nonexistent/ca.pem ./build/runner selftest >/dev/null 2>&1; then
          echo "selftest passed with a nonexistent bundle; this gate proves nothing"
          exit 1
        fi
        echo "negative control ok"

        i=1
        while [ "$i" -le 3 ]; do
          if SSL_CERT_FILE="$ca" ./build/runner selftest; then break; fi
          if [ "$i" -eq 3 ]; then echo "selftest failed three times"; exit 1; fi
          sleep 20
          i=$((i + 1))
        done
  package-irix:
    needs: test-irix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: irix-binary
        path: bin
    - name: ELF assertions
      run: |
        set -euo pipefail
        # download-artifact does not restore Unix modes. 0755 is the intent,
        # not something to preserve.
        chmod 0755 bin/runner
        desc=$(file bin/runner)
        echo "$desc"
        case "$desc" in
          *MIPS-IV*) echo "ISA is MIPS IV; that excludes R4000 and R5000"; exit 1 ;;
          *N32*MIPS-III*) ;;
          *) echo "expected an N32 MIPS-III object"; exit 1 ;;
        esac
        case "$desc" in *MSB*) ;; *) echo "not big-endian"; exit 1 ;; esac

        needed=$(readelf -d bin/runner | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | sort | tr '\n' ' ')
        echo "needs $needed"
        if [ "$needed" != "libc.so.1 libm.so libpthread.so " ]; then
          echo "unexpected library dependencies: $needed"; exit 1
        fi
        for bad in libssl libcrypto libz sgug; do
          if readelf -d bin/runner | grep -q "$bad"; then
            echo "not self-contained: links $bad"; exit 1
          fi
        done
    - name: Package
      run: |
        set -euo pipefail
        ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        name="irix-actions-runner-$ver-irix6.5-mips-n32"
        rm -rf dist "$name"
        mkdir -p "$name" dist

        cp bin/runner "$name/runner"
        cp contrib/cacert.pem "$name/cert.pem"
        cp README.md LICENSE CHANGELOG.md "$name/"
        cp man/runner.1 "$name/runner.1"
        chmod 0755 "$name/runner"
        chmod 0644 "$name/cert.pem" "$name/README.md" "$name/LICENSE" \
            "$name/CHANGELOG.md" "$name/runner.1"

        {
          echo "project    $ver"
          echo "commit     $GITHUB_SHA"
          echo "tag        $GITHUB_REF_NAME"
          echo "run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat bin/BUILD-FACTS
          echo "packaged   $(uname -srm)"
          echo "object     $(file "$name/runner")"
          echo "needs      $(readelf -d "$name/runner" | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | tr '\n' ' ')"
          echo "ca bundle  $(sed -n 's/^## Certificate data from Mozilla as of: //p' contrib/cacert.pem)"
        } > "$name/BUILD-INFO"
        chmod 0644 "$name/BUILD-INFO"
        cat "$name/BUILD-INFO"

        # ustar because stock IRIX tar understands nothing newer, and it has
        # no -z either, hence the separate gzip. Sorted with a fixed mtime so
        # the same tag produces the same bytes.
        tar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name \
            --mtime="@$(git log -1 --format=%ct)" -cf "dist/$name.tar" "$name"
        gzip -9n "dist/$name.tar"
        (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
        cat "dist/$name.tar.gz.sha256"
        ls -l dist
    - uses: actions/upload-artifact@v4
      with:
        name: irix-dist
        path: dist
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          triple: ''
          elf: x86-64
          pkg: ''
        - arch: arm64
          triple: aarch64-linux-gnu
          elf: aarch64
          pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Toolchain
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        if [ -n "${{ matrix.triple }}" ]; then
          # OpenSSL for the target arch comes from ports; archive and
          # security carry amd64 only, and apt fails the whole update on a
          # 404 for one index. So pin the stock sources to amd64 before
          # adding the architecture. 24.04 uses deb822, older images the
          # one-line format, hence both.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo sed -i 's/^deb \([^[]\)/deb [arch=amd64] \1/' \
            /etc/apt/sources.list 2>/dev/null || true
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/ports.list >/dev/null <<'PORTS'
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
        PORTS
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.pkg }} libssl-dev:arm64
        else
          sudo apt-get install -y --no-install-recommends libssl-dev
        fi
        uname -srm
        cc --version | sed -n 1p
        ldd --version | sed -n 1p
    - name: Version
      run: |
        set -euo pipefail
        ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        hdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        if [ "$hdr" != "$ver" ]; then
          echo "tag says $ver, src/version.h says $hdr"; exit 1
        fi
        man=$(sed -n 's/^\.TH RUNNER 1 .*"irix-actions-runner \([^"]*\)".*/\1/p' man/runner.1)
        if [ "$man" != "$ver" ]; then
          echo "tag says $ver, man/runner.1 says $man"; exit 1
        fi
    - name: Portability gate
      run: |
        set -euo pipefail
        make clean
        make check
    - name: Build
      run: |
        set -euo pipefail
        if [ -n "${{ matrix.triple }}" ]; then
          export CC=${{ matrix.triple }}-gcc
        fi
        # Test binaries are built here and executed in test-linux, so both
        # targets are produced by the same toolchain on the same machine.
        make -j"$(nproc)" CC="${CC:-cc}"
        make -j"$(nproc)" CC="${CC:-cc}" tests
        ls -l build/runner build/test_json
    - name: ELF assertions
      run: |
        set -euo pipefail
        desc=$(file build/runner)
        echo "$desc"
        case "$desc" in *"ELF 64-bit LSB"*) ;; *) echo "not a 64-bit LSB ELF"; exit 1 ;; esac
        case "$desc" in
          *${{ matrix.elf }}*) ;;
          *) echo "expected ${{ matrix.elf }}"; exit 1 ;;
        esac

        # An allowlist, not the exact string the IRIX job asserts: two arches
        # have two loaders, and glibc 2.34 folded libpthread into libc. The
        # loader is a NEEDED entry on aarch64 and not on x86_64.
        allow="libc.so.6 libm.so.6 libssl.so.3 libcrypto.so.3"
        allow="$allow ld-linux-x86-64.so.2 ld-linux-aarch64.so.1"
        needed=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | tr '\n' ' ')
        echo "$needed"
        for n in $needed; do
          case " $allow " in
            *" $n "*) ;;
            *) echo "unexpected dependency: $n"; exit 1 ;;
          esac
        done
        for want in libssl.so.3 libcrypto.so.3; do
          case " $needed " in
            *" $want "*) ;;
            *) echo "expected a dynamic $want"; exit 1 ;;
          esac
        done
    - name: Strip and stamp
      run: |
        set -euo pipefail
        if [ -n "${{ matrix.triple }}" ]; then
          export CC=${{ matrix.triple }}-gcc
          ${{ matrix.triple }}-strip build/runner
        else
          strip build/runner
        fi
        ls -l build/runner
        {
          echo "built on   $(uname -a)"
          echo "compiler   $(${CC:-cc} --version | sed -n 1p)"
          echo "glibc      $(ldd --version | sed -n 1p)"
          echo "openssl    $(openssl version)"
        } > build/BUILD-FACTS
        cat build/BUILD-FACTS
    - uses: actions/upload-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: build/
  test-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: build
    - name: Unit tests
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libssl3 || true
        chmod 0755 build/* 2>/dev/null || true
        uname -srm
        file build/runner
        # test-run executes the binaries as built; it never compiles.
        make test-run

        # A clean environment, so this proves the binary resolves every
        # symbol against a stock image and inherits nothing from the runner.
        # The assertion moved here from build-linux, which cross-compiles and
        # so cannot run what it produced.
        echo "--- clean environment ---"
        env -i ./build/runner version
        ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        if [ "$(env -i ./build/runner version | sed -n 1p)" != "irix-actions-runner $ver" ]; then
          echo "the built binary does not report $ver"; exit 1
        fi
    - name: TLS selftest
      run: |
        set -euo pipefail
        if SSL_CERT_FILE=/nonexistent/ca.pem ./build/runner selftest >/dev/null 2>&1; then
          echo "selftest passed with a nonexistent bundle; this gate proves nothing"
          exit 1
        fi
        echo "negative control ok"

        i=1
        while [ "$i" -le 3 ]; do
          if ./build/runner selftest; then break; fi
          if [ "$i" -eq 3 ]; then echo "selftest failed three times"; exit 1; fi
          sleep 20
          i=$((i + 1))
        done
  package-linux:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        arch:
        - x86_64
        - arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: bin
    - name: Package
      run: |
        set -euo pipefail
        ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
        name="irix-actions-runner-$ver-linux-${{ matrix.arch }}"
        rm -rf dist "$name"
        mkdir -p "$name" dist

        # download-artifact does not restore Unix modes. 0755 is the intent,
        # not something to preserve.
        cp bin/runner "$name/runner"
        cp README.md LICENSE CHANGELOG.md "$name/"
        cp man/runner.1 "$name/runner.1"
        chmod 0755 "$name/runner"
        chmod 0644 "$name/README.md" "$name/LICENSE" "$name/CHANGELOG.md" \
            "$name/runner.1"

        {
          echo "project    $ver"
          echo "commit     $GITHUB_SHA"
          echo "tag        $GITHUB_REF_NAME"
          echo "run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat bin/BUILD-FACTS
          echo "packaged   $(uname -srm)"
          echo "object     $(file "$name/runner")"
          echo "needs      $(readelf -d "$name/runner" | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | tr '\n' ' ')"
        } > "$name/BUILD-INFO"
        chmod 0644 "$name/BUILD-INFO"
        cat "$name/BUILD-INFO"

        # ustar and a fixed mtime for the same reason as the IRIX tarball:
        # the same tag produces the same bytes.
        tar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name \
            --mtime="@$(git log -1 --format=%ct)" -cf "dist/$name.tar" "$name"
        gzip -9n "dist/$name.tar"
        (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
        cat "dist/$name.tar.gz.sha256"
        ls -l dist
    - uses: actions/upload-artifact@v4
      with:
        name: linux-dist-${{ matrix.arch }}
        path: dist
  verify:
    needs:
    - package-irix
    - package-linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-dist*'
        path: dl
    - name: Verify tarballs
      run: |
        set -euo pipefail
        n=0
        for t in dl/*/*.tar.gz; do
          echo "--- $t"
          (cd "$(dirname "$t")" && sha256sum -c "$(basename "$t").sha256")
          # Listed to a file and grepped there, not piped. `grep -q` exits on
          # its first match, and under `pipefail` the SIGPIPE that gives the
          # producer fails the step. That is a race on how much tar has
          # written, so it looks like a flake rather than a bug.
          tar -tvzf "$t" > listing
          cat listing
          if ! grep -Eq '^-rwxr-xr-x .*/runner$' listing; then
            echo "the executable bit did not survive packaging"; exit 1
          fi
          n=$((n + 1))
        done
        # Counted, because the loop is silent about an artifact that never
        # arrived. An earlier revision took only the first match and would
        # have published one tarball out of three without saying so.
        if [ "$n" -ne 3 ]; then
          echo "expected 3 tarballs, found $n"; exit 1
        fi
