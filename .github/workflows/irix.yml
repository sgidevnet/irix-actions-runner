name: irix

# Runs on whatever IRIX runner is registered, hardware or an emulated pool.
#
# Kept small: it proves the runner executes a job end to end, not that anything
# builds. timeout-minutes is short because a runner that accepts a job and then
# dies would otherwise hold the queue for six hours.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/irix.yml'

jobs:
  smoke:
    runs-on: [self-hosted, irix]
    timeout-minutes: 5
    steps:
      # sed, not head. Steps run under -o pipefail, so `hinv | head -5` kills
      # hinv with SIGPIPE and fails the step.
      - name: Machine
        run: |
          uname -a
          hinv | sed -n 1,5p

      - name: Toolchain
        run: |
          echo "PATH=$PATH"
          /usr/sgug/bin/gcc --version | sed -n 1p
