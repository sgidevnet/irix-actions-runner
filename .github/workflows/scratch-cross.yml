name: scratch cross

# Temporary. Exercises build-linux (cross on x86) and test-linux (on a real
# arm64) without a tag. Delete before merging.

on:
  push:
    branches: [release/cross-and-test-on-target]

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, triple: "",                    elf: x86-64,  pkg: "" }
          - { arch: arm64,  triple: aarch64-linux-gnu,     elf: aarch64, pkg: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross" }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if [ -n "${{ matrix.triple }}" ]; then
            # OpenSSL for the target arch comes from ports; archive and
            # security carry amd64 only, and apt fails the whole update on a
            # 404 for one index. So pin the stock sources to amd64 before
            # adding the architecture. 24.04 uses deb822, older images the
            # one-line format, hence both.
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i '/^Types:/a Architectures: amd64' \
                /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo sed -i 's/^deb \([^[]\)/deb [arch=amd64] \1/' \
              /etc/apt/sources.list 2>/dev/null || true
            sudo dpkg --add-architecture arm64
            sudo tee /etc/apt/sources.list.d/ports.list >/dev/null <<'PORTS'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          PORTS
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ${{ matrix.pkg }} libssl-dev:arm64
          else
            sudo apt-get install -y --no-install-recommends libssl-dev
          fi
          uname -srm
          cc --version | sed -n 1p
          ldd --version | sed -n 1p

      - name: Version agrees with the checked-out tree
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
          echo "building $ver"

      # The %z grep. The MIPSPro half skips itself off IRIX.
      - name: Portability gate
        run: |
          set -euo pipefail
          make clean
          make check

      - name: Build the runner and the test binaries
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.triple }}" ]; then
            export CC=${{ matrix.triple }}-gcc
          fi
          # Test binaries are built here and executed in test-linux, so both
          # targets are produced by the same toolchain on the same machine.
          make -j"$(nproc)" CC="${CC:-cc}"
          make -j"$(nproc)" CC="${CC:-cc}" tests
          ls -l build/runner build/test_json

      - name: The binary is what this matrix entry claims
        run: |
          set -euo pipefail
          desc=$(file build/runner)
          echo "$desc"
          case "$desc" in *"ELF 64-bit LSB"*) ;; *) echo "not a 64-bit LSB ELF"; exit 1 ;; esac
          case "$desc" in
            *${{ matrix.elf }}*) ;;
            *) echo "expected ${{ matrix.elf }}"; exit 1 ;;
          esac

          # An allowlist, not the exact string the IRIX job asserts: two arches
          # have two loaders, and glibc 2.34 folded libpthread into libc. The
          # loader is a NEEDED entry on aarch64 and not on x86_64.
          allow="libc.so.6 libm.so.6 libssl.so.3 libcrypto.so.3"
          allow="$allow ld-linux-x86-64.so.2 ld-linux-aarch64.so.1"
          needed=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | tr '\n' ' ')
          echo "$needed"
          for n in $needed; do
            case " $allow " in
              *" $n "*) ;;
              *) echo "unexpected dependency: $n"; exit 1 ;;
            esac
          done
          for want in libssl.so.3 libcrypto.so.3; do
            case " $needed " in
              *" $want "*) ;;
              *) echo "expected a dynamic $want"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: build/

  # Runs what build-linux produced, on a machine of that architecture. A
  # cross-built binary that has never executed is not evidence of anything.
  test-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: build

      - name: Run the unit tests on real ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl3 || true
          chmod 0755 build/* 2>/dev/null || true
          uname -srm
          file build/runner
          # test-run executes the binaries as built; it never compiles.
          make test-run
          env -i ./build/runner version

