# Temporary. Runs the linux half of release.yml without a tag: the
# version comes from src/version.h and nothing is published. The job
# bodies are lifted from release.yml unchanged. Delete before merging.
name: scratch cross
"on":
  push:
    branches:
    - release/cross-and-test-on-target
permissions:
  contents: read
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          triple: ''
          elf: x86-64
          pkg: ''
        - arch: arm64
          triple: aarch64-linux-gnu
          elf: aarch64
          pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Toolchain
      run: "set -euo pipefail\nsudo apt-get update -qq\nif [ -n \"${{ matrix.triple }}\" ]; then\n  #\
        \ OpenSSL for the target arch comes from ports; archive and\n  # security carry amd64 only, and\
        \ apt fails the whole update on a\n  # 404 for one index. So pin the stock sources to amd64 before\n\
        \  # adding the architecture. 24.04 uses deb822, older images the\n  # one-line format, hence\
        \ both.\n  if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then\n    sudo sed -i '/^Types:/a\
        \ Architectures: amd64' \\\n      /etc/apt/sources.list.d/ubuntu.sources\n  fi\n  sudo sed -i\
        \ 's/^deb \\([^[]\\)/deb [arch=amd64] \\1/' \\\n    /etc/apt/sources.list 2>/dev/null || true\n\
        \  sudo dpkg --add-architecture arm64\n  sudo tee /etc/apt/sources.list.d/ports.list >/dev/null\
        \ <<'PORTS'\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe\ndeb [arch=arm64]\
        \ http://ports.ubuntu.com/ubuntu-ports noble-updates main universe\nPORTS\n  sudo apt-get update\
        \ -qq\n  sudo apt-get install -y --no-install-recommends ${{ matrix.pkg }} libssl-dev:arm64\n\
        else\n  sudo apt-get install -y --no-install-recommends libssl-dev\nfi\nuname -srm\ncc --version\
        \ | sed -n 1p\nldd --version | sed -n 1p\n"
    - name: Version agrees with the checked-out tree
      run: "set -euo pipefail\nver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\\
        (.*\\)\".*/\\1/p' src/version.h)\nhdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\
        \\(.*\\)\".*/\\1/p' src/version.h)\nif [ \"$hdr\" != \"$ver\" ]; then\n  echo \"tag says $ver,\
        \ src/version.h says $hdr\"; exit 1\nfi\nman=$(sed -n 's/^\\.TH RUNNER 1 .*\"irix-actions-runner\
        \ \\([^\"]*\\)\".*/\\1/p' man/runner.1)\nif [ \"$man\" != \"$ver\" ]; then\n  echo \"tag says\
        \ $ver, man/runner.1 says $man\"; exit 1\nfi\n"
    - name: Portability gate
      run: 'set -euo pipefail

        make clean

        make check

        '
    - name: Build the runner and the test binaries
      run: "set -euo pipefail\nif [ -n \"${{ matrix.triple }}\" ]; then\n  export CC=${{ matrix.triple\
        \ }}-gcc\nfi\n# Test binaries are built here and executed in test-linux, so both\n# targets are\
        \ produced by the same toolchain on the same machine.\nmake -j\"$(nproc)\" CC=\"${CC:-cc}\"\n\
        make -j\"$(nproc)\" CC=\"${CC:-cc}\" tests\nls -l build/runner build/test_json\n"
    - name: The binary is what this matrix entry claims
      run: "set -euo pipefail\ndesc=$(file build/runner)\necho \"$desc\"\ncase \"$desc\" in *\"ELF 64-bit\
        \ LSB\"*) ;; *) echo \"not a 64-bit LSB ELF\"; exit 1 ;; esac\ncase \"$desc\" in\n  *${{ matrix.elf\
        \ }}*) ;;\n  *) echo \"expected ${{ matrix.elf }}\"; exit 1 ;;\nesac\n\n# An allowlist, not the\
        \ exact string the IRIX job asserts: two arches\n# have two loaders, and glibc 2.34 folded libpthread\
        \ into libc. The\n# loader is a NEEDED entry on aarch64 and not on x86_64.\nallow=\"libc.so.6\
        \ libm.so.6 libssl.so.3 libcrypto.so.3\"\nallow=\"$allow ld-linux-x86-64.so.2 ld-linux-aarch64.so.1\"\
        \nneeded=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\].*/\\1/p' | tr '\\n' '\
        \ ')\necho \"$needed\"\nfor n in $needed; do\n  case \" $allow \" in\n    *\" $n \"*) ;;\n   \
        \ *) echo \"unexpected dependency: $n\"; exit 1 ;;\n  esac\ndone\nfor want in libssl.so.3 libcrypto.so.3;\
        \ do\n  case \" $needed \" in\n    *\" $want \"*) ;;\n    *) echo \"expected a dynamic $want\"\
        ; exit 1 ;;\n  esac\ndone\n"
    - name: Strip, prove it still runs, and record what built it
      run: "set -euo pipefail\nif [ -n \"${{ matrix.triple }}\" ]; then\n  export CC=${{ matrix.triple\
        \ }}-gcc\n  ${{ matrix.triple }}-strip build/runner\nelse\n  strip build/runner\nfi\nls -l build/runner\n\
        {\n  echo \"built on   $(uname -a)\"\n  echo \"compiler   $(${CC:-cc} --version | sed -n 1p)\"\
        \n  echo \"glibc      $(ldd --version | sed -n 1p)\"\n  echo \"openssl    $(openssl version)\"\
        \n} > build/BUILD-FACTS\ncat build/BUILD-FACTS\n"
    - uses: actions/upload-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: build/
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: build
    - name: Run the unit tests on real ${{ matrix.arch }}
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends libssl3 || true

        chmod 0755 build/* 2>/dev/null || true

        uname -srm

        file build/runner

        # test-run executes the binaries as built; it never compiles.

        make test-run

        env -i ./build/runner version

        '
    - name: TLS works against the system trust store
      run: "set -euo pipefail\nif SSL_CERT_FILE=/nonexistent/ca.pem ./build/runner selftest >/dev/null\
        \ 2>&1; then\n  echo \"selftest passed with a nonexistent bundle; this gate proves nothing\"\n\
        \  exit 1\nfi\necho \"negative control ok\"\n\ni=1\nwhile [ \"$i\" -le 3 ]; do\n  if ./build/runner\
        \ selftest; then break; fi\n  if [ \"$i\" -eq 3 ]; then echo \"selftest failed three times\";\
        \ exit 1; fi\n  sleep 20\n  i=$((i + 1))\ndone\n"
    needs: build-linux
  package-linux:
    strategy:
      fail-fast: false
      matrix:
        arch:
        - x86_64
        - arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-${{ matrix.arch }}
        path: bin
    - name: Package
      run: "set -euo pipefail\nver=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*\"\\\
        (.*\\)\".*/\\1/p' src/version.h)\nname=\"irix-actions-runner-$ver-linux-${{ matrix.arch }}\"\n\
        rm -rf dist \"$name\"\nmkdir -p \"$name\" dist\n\n# download-artifact does not restore Unix modes.\
        \ 0755 is the intent,\n# not something to preserve.\ncp bin/runner \"$name/runner\"\ncp README.md\
        \ LICENSE CHANGELOG.md \"$name/\"\ncp man/runner.1 \"$name/runner.1\"\nchmod 0755 \"$name/runner\"\
        \nchmod 0644 \"$name/README.md\" \"$name/LICENSE\" \"$name/CHANGELOG.md\" \\\n    \"$name/runner.1\"\
        \n\n{\n  echo \"project    $ver\"\n  echo \"commit     $GITHUB_SHA\"\n  echo \"tag        $GITHUB_REF_NAME\"\
        \n  echo \"run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"\n  cat\
        \ bin/BUILD-FACTS\n  echo \"packaged   $(uname -srm)\"\n  echo \"object     $(file \"$name/runner\"\
        )\"\n  echo \"needs      $(readelf -d \"$name/runner\" | sed -n 's/.*NEEDED.*\\[\\(.*\\)\\].*/\\\
        1/p' | tr '\\n' ' ')\"\n} > \"$name/BUILD-INFO\"\nchmod 0644 \"$name/BUILD-INFO\"\ncat \"$name/BUILD-INFO\"\
        \n\n# ustar and a fixed mtime for the same reason as the IRIX tarball:\n# the same tag produces\
        \ the same bytes.\ntar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name \\\n   \
        \ --mtime=\"@$(git log -1 --format=%ct)\" -cf \"dist/$name.tar\" \"$name\"\ngzip -9n \"dist/$name.tar\"\
        \n(cd dist && sha256sum \"$name.tar.gz\" > \"$name.tar.gz.sha256\")\ncat \"dist/$name.tar.gz.sha256\"\
        \nls -l dist\n"
    - uses: actions/upload-artifact@v4
      with:
        name: linux-dist-${{ matrix.arch }}
        path: dist
    needs: test-linux
  verify:
    needs: package-linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-dist*'
        path: dl
    - name: Verify what came off the build machines
      run: "set -euo pipefail\nn=0\nfor t in dl/*/*.tar.gz; do\n  echo \"--- $t\"\n  (cd \"$(dirname \"\
        $t\")\" && sha256sum -c \"$(basename \"$t\").sha256\")\n  # Listed to a file and grepped there,\
        \ not piped. `grep -q` exits on\n  # its first match, and under `pipefail` the SIGPIPE that gives\
        \ the\n  # producer fails the step. That is a race on how much tar has\n  # written, so it looks\
        \ like a flake rather than a bug.\n  tar -tvzf \"$t\" > listing\n  cat listing\n  if ! grep -Eq\
        \ '^-rwxr-xr-x .*/runner$' listing; then\n    echo \"the executable bit did not survive packaging\"\
        ; exit 1\n  fi\n  n=$((n + 1))\ndone\n# Counted, because the loop is silent about an artifact\
        \ that never\n# arrived. An earlier revision took only the first match and would\n# have published\
        \ one tarball out of three without saying so.\nif [ \"$n\" -ne 2 ]; then\n  echo \"expected 2\
        \ tarballs, found $n\"; exit 1\nfi\n"
