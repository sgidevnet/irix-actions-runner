name: release

# Builds the shipping binary on IRIX and publishes a draft release.
#
# Triggered by pushing a tag. The version is not invented here: it must already
# agree across the tag, SGUG_PROJECT_VERSION in src/version.h, and a CHANGELOG
# section, or the run fails before it reaches the IRIX build.
#
# Two constraints shape every step in `build-irix`, both from this runner, and
# neither applies to `build-linux`:
#
#   1. There is no expression evaluator, so `${{ }}` is unusable there. In a
#      `run:` body it is now a hard error; in a `with:` value it silently reads
#      as absent. Use the $GITHUB_* shell variables instead. `build-linux` is on
#      hosted runners and reads `${{ matrix.* }}` normally.
#   2. No GITHUB_TOKEN reaches steps, so IRIX cannot call the REST API. The
#      release itself is created from a hosted runner.
#
# Re-running one failed build job hits a 409 on artifact upload, because artifact
# names must be unique per workflow run and the previous attempt's is still
# there. Re-run the whole workflow instead.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap gate on a hosted runner. A mistyped tag fails here in under a minute
  # rather than after a full IRIX build.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version agrees across tag, header, changelog and manpage
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          case "$ver" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          hdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
          if [ -z "$hdr" ]; then
            echo "SGUG_PROJECT_VERSION not found in src/version.h"; exit 1
          fi
          if [ "$hdr" != "$ver" ]; then
            echo "tag says $ver, src/version.h says $hdr"; exit 1
          fi
          if ! grep -q "^## \[$ver\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$ver]' section"; exit 1
          fi
          man=$(sed -n 's/^\.TH RUNNER 1 .*"irix-actions-runner \([^"]*\)".*/\1/p' man/runner.1)
          if [ "$man" != "$ver" ]; then
            echo "tag says $ver, man/runner.1 says $man"; exit 1
          fi
          echo "version $ver agrees"

      - name: CA bundle is present and plausible
        run: |
          set -euo pipefail
          n=$(grep -c 'BEGIN CERTIFICATE' contrib/cacert.pem)
          echo "contrib/cacert.pem carries $n certificates"
          if [ "$n" -lt 100 ]; then echo "bundle looks truncated"; exit 1; fi

  build-irix:
    needs: preflight
    runs-on: ubuntu-24.04
    container: ${{ vars.IRIX_CROSS_IMAGE || 'ghcr.io/sgidevnet/irix-cross:0.1.0' }}
    timeout-minutes: 30
    # Named, not inherited. bash is in the image, but the runner's probe picked
    # sh for the container and dash has no pipefail, so every step died on its
    # first line.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Repeated from preflight, against the tree that was actually checked out.
      - name: Version agrees with the checked-out tree
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          hdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
          if [ "$hdr" != "$ver" ]; then
            echo "tag says $ver, src/version.h says $hdr"; exit 1
          fi

          # The manpage is hand-written, so its .TH version is the one thing in
          # it that can go stale without anyone noticing.
          man=$(sed -n 's/^\.TH RUNNER 1 .*"irix-actions-runner \([^"]*\)".*/\1/p' man/runner.1)
          if [ "$man" != "$ver" ]; then
            echo "tag says $ver, man/runner.1 says $man"; exit 1
          fi
          echo "building $ver from $GITHUB_SHA"

      # The %z grep half. The MIPSPro half is portability-irix's job; this
      # target skips it off IRIX and says so.
      - name: Portability gate
        run: |
          set -euo pipefail
          make check

      - name: Build the runner and the test binaries
        run: |
          set -euo pipefail
          # IRIX_SYSROOT is what puts the Makefile on its cross branch. The
          # image sets it, along with IRIX_OPENSSL and MOGRIX_NO_DLMALLOC.
          test -n "${IRIX_SYSROOT:-}" || { echo "not an IRIX cross image"; exit 1; }
          make -j"$(nproc)"
          make -j"$(nproc)" tests
          ls -l build/runner build/test_json

      - name: The binary is portable to any IRIX 6.5 machine
        run: |
          set -euo pipefail
          desc=$(file build/runner)
          echo "$desc"
          # MIPS III is R4000 and later, which is every CPU that runs IRIX 6.5.
          # MIPS IV would quietly exclude the R4400 and R5000 machines.
          case "$desc" in
            *MIPS-IV*) echo "ISA is MIPS IV; that excludes R4000 and R5000"; exit 1 ;;
            *N32*MIPS-III*) ;;
            *) echo "expected an N32 MIPS-III object"; exit 1 ;;
          esac
          case "$desc" in *MSB*) ;; *) echo "not big-endian"; exit 1 ;; esac

          readelf -d build/runner | grep -E 'NEEDED|RPATH' || true
          needed=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | sort | tr '\n' ' ')
          if [ "$needed" != "libc.so.1 libm.so libpthread.so " ]; then
            echo "unexpected library dependencies: $needed"; exit 1
          fi
          for bad in libssl libcrypto libz sgug; do
            if readelf -d build/runner | grep -q "$bad"; then
              echo "not self-contained: links $bad"; exit 1
            fi
          done

      - name: Record what built it
        run: |
          set -euo pipefail
          {
            echo "built on   $(uname -a) (cross)"
            echo "compiler   $(clang --version | sed -n 1p)"
            echo "linker     $(basename "$IRIX_LLD")"
            echo "openssl    $(strings -a build/runner | grep '^OpenSSL 1\.' | sed -n 1p)"
          } > build/BUILD-FACTS
          cat build/BUILD-FACTS
          find build \( -name '*.o' -o -name '*.d' \) -delete

      - uses: actions/upload-artifact@v4
        with:
          name: irix-binary
          path: build

  # The only machine that can say whether the cross build works. Nothing here
  # compiles: it runs what build-irix produced, and strips it, because binutils
  # on x86 has no MIPS BFD target and refuses the file outright.
  test-irix:
    needs: build-irix
    runs-on: [self-hosted, irix]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before the download, not after: this runner never wipes the workspace,
      # and git clean would take the artifact with it.
      - name: Clean the workspace
        run: |
          set -eu
          git clean -xdff

      # path: build, because the two ends disagree about the leading component.
      # build-irix is on a hosted runner, so `path: build` there uploads the
      # contents and the members arrive named runner, test_json and so on. This
      # runner's own upload-artifact would have kept the build/ prefix. Naming
      # the destination is what makes make test-run find them either way.
      - uses: actions/download-artifact@v4
        with:
          name: irix-binary
          path: build

      - name: Run the unit tests on IRIX
        run: |
          set -eu
          chmod 0755 build/runner build/test_*
          make test-run

      - name: The binary starts on a stock machine
        run: |
          set -eu
          # env -i proves rld resolves every symbol against base IRIX, with no
          # LD_LIBRARYN32_PATH and nothing inherited from the runner.
          echo "--- clean environment ---"
          env -i ./build/runner version
          ver="${GITHUB_REF_NAME#v}"
          if [ "$(env -i ./build/runner version | sed -n 1p)" != "irix-actions-runner $ver" ]; then
            echo "the built binary does not report $ver"; exit 1
          fi

      - name: TLS works against the bundle we ship
        run: |
          set -eu
          ca="$PWD/contrib/cacert.pem"
          n=$(grep -c 'BEGIN CERTIFICATE' "$ca")
          echo "bundle carries $n certificates"
          if [ "$n" -lt 100 ]; then echo "bundle looks truncated"; exit 1; fi

          # Negative control. Without it a future change that ignores
          # SSL_CERT_FILE would leave this gate passing forever while proving
          # only that SGUG-RSE happens to be installed on the machine.
          if SSL_CERT_FILE=/nonexistent/ca.pem ./build/runner selftest >/dev/null 2>&1; then
            echo "selftest passed with a nonexistent bundle; this gate proves nothing"
            exit 1
          fi
          echo "negative control ok"

          i=1
          while [ "$i" -le 3 ]; do
            if SSL_CERT_FILE="$ca" ./build/runner selftest; then break; fi
            if [ "$i" -eq 3 ]; then echo "selftest failed three times"; exit 1; fi
            sleep 20
            i=$((i + 1))
          done

      - name: Strip, and prove it still runs
        run: |
          set -eu
          strip build/runner
          ls -l build/runner
          env -i ./build/runner version
          rm -f build/test_*

      - uses: actions/upload-artifact@v4
        with:
          name: irix-stripped
          path: build


  # Everything a MIPS binary can be asserted about from x86: `file` and
  # `readelf` are target-independent readers. `strip` is not, which is why it
  # stays on IRIX; binutils here has no MIPS BFD target and refuses the file.
  package-irix:
    needs: test-irix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: irix-stripped
          path: bin

      - name: The binary is portable to any IRIX 6.5 machine
        run: |
          set -euo pipefail
          # download-artifact does not restore Unix modes. 0755 is the intent,
          # not something to preserve.
          chmod 0755 bin/build/runner
          desc=$(file bin/build/runner)
          echo "$desc"
          case "$desc" in
            *MIPS-IV*) echo "ISA is MIPS IV; that excludes R4000 and R5000"; exit 1 ;;
            *N32*MIPS-III*) ;;
            *) echo "expected an N32 MIPS-III object"; exit 1 ;;
          esac
          case "$desc" in *MSB*) ;; *) echo "not big-endian"; exit 1 ;; esac

          needed=$(readelf -d bin/build/runner | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | sort | tr '\n' ' ')
          echo "needs $needed"
          if [ "$needed" != "libc.so.1 libm.so libpthread.so " ]; then
            echo "unexpected library dependencies: $needed"; exit 1
          fi
          for bad in libssl libcrypto libz sgug; do
            if readelf -d bin/build/runner | grep -q "$bad"; then
              echo "not self-contained: links $bad"; exit 1
            fi
          done

      - name: Package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          name="irix-actions-runner-$ver-irix6.5-mips-n32"
          rm -rf dist "$name"
          mkdir -p "$name" dist

          cp bin/build/runner "$name/runner"
          cp contrib/cacert.pem "$name/cert.pem"
          cp README.md LICENSE CHANGELOG.md "$name/"
          cp man/runner.1 "$name/runner.1"
          chmod 0755 "$name/runner"
          chmod 0644 "$name/cert.pem" "$name/README.md" "$name/LICENSE" \
              "$name/CHANGELOG.md" "$name/runner.1"

          {
            echo "project    $ver"
            echo "commit     $GITHUB_SHA"
            echo "tag        $GITHUB_REF_NAME"
            echo "run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            cat bin/build/BUILD-FACTS
            echo "packaged   $(uname -srm)"
            echo "object     $(file "$name/runner")"
            echo "needs      $(readelf -d "$name/runner" | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | tr '\n' ' ')"
            echo "ca bundle  $(sed -n 's/^## Certificate data from Mozilla as of: //p' contrib/cacert.pem)"
          } > "$name/BUILD-INFO"
          chmod 0644 "$name/BUILD-INFO"
          cat "$name/BUILD-INFO"

          # ustar because stock IRIX tar understands nothing newer, and it has
          # no -z either, hence the separate gzip. Sorted with a fixed mtime so
          # the same tag produces the same bytes.
          tar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name \
              --mtime="@$(git log -1 --format=%ct)" -cf "dist/$name.tar" "$name"
          gzip -9n "dist/$name.tar"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: irix-dist
          path: dist

  # Cross-compiled on x86_64 for every Linux target, then the binaries are run
  # on a real machine of that arch in test-linux. Building in one place keeps
  # one glibc floor and one toolchain; running elsewhere is what makes a
  # cross-built artifact worth trusting.
  build-linux:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, triple: "",                    elf: x86-64,  pkg: "" }
          - { arch: arm64,  triple: aarch64-linux-gnu,     elf: aarch64, pkg: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross" }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if [ -n "${{ matrix.triple }}" ]; then
            # OpenSSL for the target arch comes from ports; archive and
            # security carry amd64 only, and apt fails the whole update on a
            # 404 for one index. So pin the stock sources to amd64 before
            # adding the architecture. 24.04 uses deb822, older images the
            # one-line format, hence both.
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i '/^Types:/a Architectures: amd64' \
                /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo sed -i 's/^deb \([^[]\)/deb [arch=amd64] \1/' \
              /etc/apt/sources.list 2>/dev/null || true
            sudo dpkg --add-architecture arm64
            sudo tee /etc/apt/sources.list.d/ports.list >/dev/null <<'PORTS'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          PORTS
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ${{ matrix.pkg }} libssl-dev:arm64
          else
            sudo apt-get install -y --no-install-recommends libssl-dev
          fi
          uname -srm
          cc --version | sed -n 1p
          ldd --version | sed -n 1p

      - name: Version agrees with the checked-out tree
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          hdr=$(sed -n 's/^#define[[:space:]]*SGUG_PROJECT_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
          if [ "$hdr" != "$ver" ]; then
            echo "tag says $ver, src/version.h says $hdr"; exit 1
          fi
          man=$(sed -n 's/^\.TH RUNNER 1 .*"irix-actions-runner \([^"]*\)".*/\1/p' man/runner.1)
          if [ "$man" != "$ver" ]; then
            echo "tag says $ver, man/runner.1 says $man"; exit 1
          fi

      # The %z grep. The MIPSPro half skips itself off IRIX.
      - name: Portability gate
        run: |
          set -euo pipefail
          make clean
          make check

      - name: Build the runner and the test binaries
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.triple }}" ]; then
            export CC=${{ matrix.triple }}-gcc
          fi
          # Test binaries are built here and executed in test-linux, so both
          # targets are produced by the same toolchain on the same machine.
          make -j"$(nproc)" CC="${CC:-cc}"
          make -j"$(nproc)" CC="${CC:-cc}" tests
          ls -l build/runner build/test_json

      - name: The binary is what this matrix entry claims
        run: |
          set -euo pipefail
          desc=$(file build/runner)
          echo "$desc"
          case "$desc" in *"ELF 64-bit LSB"*) ;; *) echo "not a 64-bit LSB ELF"; exit 1 ;; esac
          case "$desc" in
            *${{ matrix.elf }}*) ;;
            *) echo "expected ${{ matrix.elf }}"; exit 1 ;;
          esac

          # An allowlist, not the exact string the IRIX job asserts: two arches
          # have two loaders, and glibc 2.34 folded libpthread into libc. The
          # loader is a NEEDED entry on aarch64 and not on x86_64.
          allow="libc.so.6 libm.so.6 libssl.so.3 libcrypto.so.3"
          allow="$allow ld-linux-x86-64.so.2 ld-linux-aarch64.so.1"
          needed=$(readelf -d build/runner | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | tr '\n' ' ')
          echo "$needed"
          for n in $needed; do
            case " $allow " in
              *" $n "*) ;;
              *) echo "unexpected dependency: $n"; exit 1 ;;
            esac
          done
          for want in libssl.so.3 libcrypto.so.3; do
            case " $needed " in
              *" $want "*) ;;
              *) echo "expected a dynamic $want"; exit 1 ;;
            esac
          done

      # The packaging job runs on a different image and cannot see the
      # toolchain that produced this, so the facts travel with the binary. The
      # glibc line is the floor an operator needs and nothing else records it.
      #
      # strip has to happen here for the same reason: the target's binutils are
      # installed on this machine and not on the packaging one. The Linux half
      # of CFLAGS carries -g, so an unstripped runner is most of the tarball.
      - name: Strip, prove it still runs, and record what built it
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.triple }}" ]; then
            export CC=${{ matrix.triple }}-gcc
            ${{ matrix.triple }}-strip build/runner
          else
            strip build/runner
          fi
          ls -l build/runner
          {
            echo "built on   $(uname -a)"
            echo "compiler   $(${CC:-cc} --version | sed -n 1p)"
            echo "glibc      $(ldd --version | sed -n 1p)"
            echo "openssl    $(openssl version)"
          } > build/BUILD-FACTS
          cat build/BUILD-FACTS

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: build/

  # Runs what build-linux produced, on a machine of that architecture. A
  # cross-built binary that has never executed is not evidence of anything.
  test-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: build

      - name: Run the unit tests on real ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl3 || true
          chmod 0755 build/* 2>/dev/null || true
          uname -srm
          file build/runner
          # test-run executes the binaries as built; it never compiles.
          make test-run

          # A clean environment, so this proves the binary resolves every
          # symbol against a stock image and inherits nothing from the runner.
          # The assertion moved here from build-linux, which cross-compiles and
          # so cannot run what it produced.
          echo "--- clean environment ---"
          env -i ./build/runner version
          ver="${GITHUB_REF_NAME#v}"
          if [ "$(env -i ./build/runner version | sed -n 1p)" != "irix-actions-runner $ver" ]; then
            echo "the built binary does not report $ver"; exit 1
          fi

      # No bundle ships on Linux, so what is under test is that the binary
      # finds the distribution's own store. The negative control is what makes
      # that a claim: without it this passes on a build that ignores
      # SSL_CERT_FILE and never reads a store at all.
      - name: TLS works against the system trust store
        run: |
          set -euo pipefail
          if SSL_CERT_FILE=/nonexistent/ca.pem ./build/runner selftest >/dev/null 2>&1; then
            echo "selftest passed with a nonexistent bundle; this gate proves nothing"
            exit 1
          fi
          echo "negative control ok"

          i=1
          while [ "$i" -le 3 ]; do
            if ./build/runner selftest; then break; fi
            if [ "$i" -eq 3 ]; then echo "selftest failed three times"; exit 1; fi
            sleep 20
            i=$((i + 1))
          done

  # Packaged only after the binary has run on hardware of its own
  # architecture, and on the machine that has GNU tar rather than the one that
  # built it, which is the same split build-irix and package-irix use.
  package-linux:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: bin

      - name: Package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          name="irix-actions-runner-$ver-linux-${{ matrix.arch }}"
          rm -rf dist "$name"
          mkdir -p "$name" dist

          # download-artifact does not restore Unix modes. 0755 is the intent,
          # not something to preserve.
          cp bin/runner "$name/runner"
          cp README.md LICENSE CHANGELOG.md "$name/"
          cp man/runner.1 "$name/runner.1"
          chmod 0755 "$name/runner"
          chmod 0644 "$name/README.md" "$name/LICENSE" "$name/CHANGELOG.md" \
              "$name/runner.1"

          {
            echo "project    $ver"
            echo "commit     $GITHUB_SHA"
            echo "tag        $GITHUB_REF_NAME"
            echo "run        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            cat bin/BUILD-FACTS
            echo "packaged   $(uname -srm)"
            echo "object     $(file "$name/runner")"
            echo "needs      $(readelf -d "$name/runner" | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p' | tr '\n' ' ')"
          } > "$name/BUILD-INFO"
          chmod 0644 "$name/BUILD-INFO"
          cat "$name/BUILD-INFO"

          # ustar and a fixed mtime for the same reason as the IRIX tarball:
          # the same tag produces the same bytes.
          tar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name \
              --mtime="@$(git log -1 --format=%ct)" -cf "dist/$name.tar" "$name"
          gzip -9n "dist/$name.tar"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist-${{ matrix.arch }}
          path: dist

  publish:
    needs: [package-irix, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-dist*'
          path: dl

      - name: Verify what came off the build machines
        run: |
          set -euo pipefail
          n=0
          for t in dl/*/*.tar.gz; do
            echo "--- $t"
            (cd "$(dirname "$t")" && sha256sum -c "$(basename "$t").sha256")
            # Listed to a file and grepped there, not piped. `grep -q` exits on
            # its first match, and under `pipefail` the SIGPIPE that gives the
            # producer fails the step. That is a race on how much tar has
            # written, so it looks like a flake rather than a bug.
            tar -tvzf "$t" > listing
            cat listing
            if ! grep -Eq '^-rwxr-xr-x .*/runner$' listing; then
              echo "the executable bit did not survive packaging"; exit 1
            fi
            n=$((n + 1))
          done
          # Counted, because the loop is silent about an artifact that never
          # arrived. An earlier revision took only the first match and would
          # have published one tarball out of three without saying so.
          if [ "$n" -ne 3 ]; then
            echo "expected 3 tarballs, found $n"; exit 1
          fi

      - name: Release notes
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "no CHANGELOG content for $ver"; exit 1
          fi
          cat > notes.md <<'PREAMBLE'
          Native GitHub Actions runner for SGI IRIX, and for the Linux hosts
          that dispatch jobs to emulated Indys.

          **IRIX 6.5.22 and later**, MIPS n32, on an R4000 or later CPU. The
          binary needs only `libc.so.1`, `libpthread.so` and `libm.so`, all
          IRIX base. `cert.pem` ships alongside it and is found automatically;
          no SGUG-RSE needed to run. `git`, `zip` and `unzip` are needed only
          for `uses:` steps. Stock IRIX `tar` cannot decompress, so extract
          with:

              gzip -dc irix-actions-runner-*.tar.gz | tar xvf -

          **Linux x86_64 and arm64**, built on Ubuntu 24.04. Needs glibc 2.39
          and OpenSSL 3 from the host, and Docker for `runner serve`. No
          `cert.pem` ships; `SSL_CERT_FILE` overrides the system trust store.

          Built and tested on IRIX 6.5.30m. Earlier 6.5.x releases and other SGI
          models are expected to work and are untested. See `BUILD-INFO` in each
          tarball for exactly what was built and on what.

          If the first connection fails, run `./runner selftest`: an undisciplined
          clock and an expired CA bundle are the two usual causes.

          PREAMBLE
          cat body.md >> notes.md
          cat notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          pre=""
          case "${tag#v}" in *-*) pre="--prerelease" ;; esac

          # gh takes an asset as path#label, and the label is what the download
          # page shows. An unrecognised name is an error rather than an unlabelled
          # asset, so a new platform cannot ship anonymously.
          assets=()
          plain=()
          for t in dl/*/*.tar.gz; do
            case "$t" in
              *irix6.5-mips-n32*) label="IRIX 6.5 MIPS n32" ;;
              *linux-x86_64*)     label="Linux x86_64" ;;
              *linux-arm64*)      label="Linux arm64" ;;
              *) echo "no label for $t"; exit 1 ;;
            esac
            assets+=("$t#$label tarball" "$t.sha256#$label SHA-256")
            plain+=("$t" "$t.sha256")
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${plain[@]}" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --verify-tag --draft $pre \
              --title "$tag" --notes-file notes.md "${assets[@]}"
          fi
          gh release view "$tag" --json isDraft,assets
